<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cookie Assignment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #800000;
        }

        #cookieDisplay {
            margin-top: 25px;
            font-size: 20px;
            color: #333;
        }

        footer {
            margin-top: 100px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>JavaScript Cookie Example</h1>

    <p>This webpage demonstrates how cookies work.</p>

    <div id="cookieDisplay"></div>

    <script>

        function setCookie(name, value, days) {
            const date = new Date();

            date.setTime(
                date.getTime() + (days * 24 * 60 * 60 * 1000)
            );

            let expires = "expires=" + date.toUTCString();

            document.cookie =
                name + "=" + encodeURIComponent(value) +
                ";" + expires + ";path=/;SameSite=Lax";
        }

        function getCookie(name) {
            let cookieName = name + "=";
            let cookies = document.cookie.split(';');

            for (let i = 0; i < cookies.length; i++) {
                let cookie = cookies[i].trim();

                if (cookie.indexOf(cookieName) == 0) {
                    return decodeURIComponent(
                        cookie.substring(cookieName.length)
                    );
                }
            }

            return "";
        }

        let savedCookie = getCookie("studentCookie");

        if (savedCookie == "") {

            let answer = prompt(
                "Enter something to save in a cookie:"
            );

            if (answer === null) {
                answer = "Guest";
            }

            setCookie("studentCookie", answer, 7);

            savedCookie = answer;
        }

        document.getElementById("cookieDisplay").textContent =
            "Your saved cookie is: " + savedCookie;

    </script>

    <footer>
        &copy; Erik Preisner, 11/18/26
    </footer>

</body>
</html>
